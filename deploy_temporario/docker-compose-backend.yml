version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3.10-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal                          # ← ADICIONADO

  backend:
    image: guilhermefigueiredodocker/brinks-backend-prod:latest
    container_name: backend
    depends_on:
      rabbitmq:
        condition: service_healthy
      ms-report-async:                    # ← ADICIONADO
        condition: service_healthy        # ← ADICIONADO
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      API_GATEWAY_URL: ${api_url}
      MS_REPORT_URL: http://ms-report-async:8081
      SPRING_DATASOURCE_URL: jdbc:mysql://${db_host}:3306/db_brink_calcados?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      JWT_SECRET: brink-calcados-super-secret-key-com-32-caracteres-ou-mais-2026
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m"   # ← JAVA_OPTS → JAVA_TOOL_OPTIONS
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - internal                          # ← ADICIONADO

  ms-report-async:
    image: guilhermefigueiredodocker/brinks-ms-report:latest
    container_name: ms-report-async
    # ports: removido — não precisa expor pro host, só comunicação interna
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
      AWS_REGION: us-east-1
      AWS_S3_BUCKET_TRUSTED: ${bucket_trusted}
      AWS_S3_BUCKET_CLIENT: ${bucket_client}
    healthcheck:                          # ← ADICIONADO
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - internal                          # ← ADICIONADO

  ms-email:
    image: guilhermefigueiredodocker/brinks-ms-email:latest
    container_name: ms-email
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
    restart: unless-stopped
    networks:
      - internal                          # ← ADICIONADO

volumes:
  rabbitmq_data:

networks:                                 # ← ADICIONADO
  internal:
    driver: bridge